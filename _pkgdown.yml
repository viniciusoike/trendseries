url: https://viniciusoike.github.io/trendseries/

template:
  bootstrap: 5
  bslib:
    bootswatch: yeti
    pkgdown-nav-height: 100px
    base_font: {google: "Roboto"}
    heading_font: {google: "Lora"}
    code_font: {google: "JetBrains Mono"}
    "code-font-size": 0.82em
    primary: "#1E3A5F"
    bg: "#fefefe"
    fg: "#000000"


logo:
  src: man/figures/logo.png
  alt: "trendseries hexsticker"

home:
  # Prevent dev-only .md files from being rendered as site pages
  links:
  - text: Browse source code
    href: https://github.com/viniciusoike/trendseries

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/viniciusoike/trendseries
      aria-label: GitHub

articles:
  # Top-level files are package vignettes; files under vignettes/articles
  # are rendered as pkgdown articles.
  - title: Vignettes
    contents:
      - trendseries
      - methods
  - title: Articles
    navbar: ~
    contents:
      - articles/augment-trends
      - articles/decompose-series
      - articles/detrend-series
      - articles/econometric-filters
      - articles/moving-averages

reference:
  - title: Trend extraction
    desc: Add or extract smooth trend components.
    contents:
      - augment_trends
      - extract_trends
      - detrend_series
  - title: Rolling aggregations
    desc: Calculate rolling and year-to-date statistics.
    contents:
      - augment_rolling
      - roll_series
  - title: Decomposition
    desc: Split a series into trend, seasonal, and remainder components.
    contents:
      - decompose_series
      - deseason_series
  - title: Converters
    desc: Convert between data frames and time series objects.
    contents:
      - converters
      - df_to_ts
      - ts_to_df
  - title: Datasets
    desc: Bundled economic time series for examples and testing.
    contents:
      - has_keyword("datasets")
